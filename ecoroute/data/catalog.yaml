# EcoRoute model catalog
# ------------------------------------------------------------------
# Every number here is an editable assumption, not ground truth.
#   price_in / price_out : USD per 1M tokens (provider list price snapshot — verify
#                          against each provider's pricing page before relying on it)
#   params_total_b / params_active_b : billions of parameters (null = undisclosed)
#   quality  : 0-100 composite capability score used for ranking (relative, editable)
#   max_tier : highest prompt-complexity tier (1-5) this model is trusted with
#   tps      : typical output tokens/second (used for latency score)
#   region   : key into grid.yaml (carbon + off-site water intensity)
#   pue      : data-centre Power Usage Effectiveness
#   wue      : on-site Water Usage Effectiveness, litres per kWh (0 for local)
#   device_watts : (local models only) measured power draw while generating
# ------------------------------------------------------------------
